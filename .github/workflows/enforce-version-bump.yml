name: Enforce version bump

# Every merge to main triggers a real PyPI publish (see publish-pypi.yml) using
# whatever version is in pyproject.toml. This check catches the "forgot to
# bump the version" mistake at PR time, before merge, instead of at publish
# time when the PyPI upload would simply fail.

on:
  pull_request:
    branches: [main]

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compare pyproject.toml version against main
        run: |
          python3 <<'PYEOF'
          import subprocess
          import sys
          import tomllib

          def version_at(ref):
              content = subprocess.run(
                  ["git", "show", f"{ref}:pyproject.toml"],
                  capture_output=True, text=True, check=True,
              ).stdout
              return tomllib.loads(content)["project"]["version"]

          main_version = version_at("origin/main")
          pr_version = version_at("HEAD")

          print(f"main:    {main_version}")
          print(f"this PR: {pr_version}")

          if main_version == pr_version:
              print(
                  f"::error::pyproject.toml version ({pr_version}) was not bumped "
                  "relative to main. Every merge to main publishes to PyPI, so the "
                  "version must change."
              )
              sys.exit(1)
          PYEOF
